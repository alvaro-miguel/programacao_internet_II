<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini-Prontuário</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous" />

  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>

<body>
  <header class="app-header">
    <div class="container">
      <p class="app-header__eyebrow">IFPI · Programação para Internet II</p>
      <h1 class="app-header__title">Mini-Prontuário</h1>
    </div>
  </header>

    <main class="container app-main">
    
    <header class="mb-4">
      <h2 id="patient-name" class="fs-4">Carregando paciente...</h2>
      <a href="/" class="text-decoration-none text-secondary">← Voltar para a lista</a>
    </header>

    <section class="mb-5 p-4 border rounded bg-white shadow-sm">
      <h3 class="fs-5 mb-3">Registrar Novo Atendimento</h3>
      
      <form id="encounter-form">
        <div id="form-error" class="alert alert-danger d-none" role="alert"></div>

        <div class="mb-3">
          <label for="chiefComplaint" class="form-label">Queixa Principal *</label>
          <input type="text" id="chiefComplaint" name="chiefComplaint" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="startedAt" class="form-label">Data e Hora de Início *</label>
          <input type="datetime-local" id="startedAt" name="startedAt" class="form-control" required>
        </div>

        <div class="mb-3">
          <label for="notes" class="form-label">Conduta (Opcional)</label>
          <textarea id="notes" name="notes" class="form-control" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn">Salvar Atendimento</button>
      </form>
    </section>

    <section>
      <h3 class="fs-5 mb-3">Histórico de Atendimentos</h3>
      <ul id="encounter-list" class="list-unstyled"></ul>
    </section>

  </main>

  <script type="module" src="./js/patient-app.js"></script>
  </body>
</html>
